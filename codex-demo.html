<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #f8fafc;
      background: #111827;
    }
    main {
      max-width: 680px;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }
    p {
      margin: 0;
      color: #d1d5db;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Codex HTML Upload</h1>
    <p>这个页面由 Codex 上传到 GitHub 仓库，用于验证 GitHub 连接和推送流程。</p>
  </main>
</body>
</html>
